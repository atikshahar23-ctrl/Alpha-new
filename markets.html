<style>

<style>
:root{
  --bg:#04060d; --cyan:#00f0ff; --up:#00ffa6; --down:#ff3d6e; --gold:#ffd166;
  --txt:#d9f4ff; --dim:#6d90a8; --line:rgba(0,240,255,.28);
  --panel:rgba(7,14,28,.92);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--txt);
  font-family:'Heebo',sans-serif;min-height:100dvh}
body{background:
  radial-gradient(ellipse 90% 55% at 50% -10%, rgba(0,240,255,.08), transparent 60%),
  radial-gradient(ellipse 70% 45% at 85% 110%, rgba(255,47,214,.06), transparent 55%),
  var(--bg)}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  background:rgba(4,6,13,.94);border-bottom:1px solid rgba(0,240,255,.16)}
header h1{margin:0;font-size:17px;font-weight:800;letter-spacing:.4px}
header h1 b{color:var(--cyan)}
.hcount{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim)}
.hspace{flex:1}
.hbtn{background:rgba(6,12,26,.8);border:1px solid var(--line);color:var(--cyan);
  border-radius:10px;padding:6px 11px;font-size:12px;cursor:pointer;font-family:inherit}
a.hbtn{text-decoration:none;color:var(--gold);border-color:rgba(255,209,102,.4)}
#scanStat{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--gold)}
main{max-width:900px;margin:0 auto;padding:10px 10px calc(20px + env(safe-area-inset-bottom))}
.search{width:100%;background:rgba(2,10,18,.9);color:var(--txt);
  border:1px solid rgba(0,240,255,.25);border-radius:10px;padding:10px 12px;
  font-size:14px;font-family:inherit;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{padding:6px 12px;border-radius:999px;font-size:12px;cursor:pointer;
  background:rgba(6,12,26,.7);color:var(--dim);border:1px solid rgba(0,240,255,.18);font-family:inherit}
.tabs button.on{color:#02141a;background:linear-gradient(120deg,var(--cyan),#7dfbff);
  border-color:var(--cyan);font-weight:700}
/* seven data columns fit a desktop; on the phone the grid collapses per-cell */
.mhead,.mrow{display:grid;gap:6px;align-items:center;
  grid-template-columns:1.5fr .85fr .62fr .62fr .62fr .55fr .6fr .95fr}
.mhead{padding:4px 6px 8px;border-bottom:1px solid rgba(0,240,255,.14);position:sticky;top:56px;
  background:rgba(4,6,13,.96);z-index:4}
.mhead button{background:none;border:none;color:var(--dim);font-size:10.5px;cursor:pointer;
  text-align:end;font-family:'Heebo',sans-serif;padding:0}
.mhead button:first-child{text-align:start}
.mhead button.on{color:var(--cyan);font-weight:700}
.mrow{padding:9px 6px;border-bottom:1px solid rgba(255,255,255,.05);cursor:pointer}
.mrow:hover{background:rgba(0,240,255,.05)}
.mname{display:flex;align-items:center;gap:7px;min-width:0}
.star{cursor:pointer;font-size:13px;color:#4a5b6b;flex:none}
.star.on{color:var(--gold)}
.nn{display:flex;flex-direction:column;min-width:0}
.n1{display:flex;gap:5px;align-items:center;font-weight:700;font-size:13px}
.n1 b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:8.5px;padding:1px 4px;border-radius:4px;background:rgba(0,240,255,.14);color:var(--cyan);flex:none}
.sub{font-size:9.5px;color:var(--dim);font-family:'JetBrains Mono',monospace}
.num{font-family:'JetBrains Mono',monospace;font-size:11.5px;text-align:end}
.rec{text-align:end}
.rec i{font-style:normal;font-weight:800;padding:2px 6px;border-radius:6px;font-size:11px;
  font-family:'JetBrains Mono',monospace;background:rgba(255,255,255,.06);color:var(--dim);white-space:nowrap}
.rec i.long{background:rgba(0,255,166,.14);color:var(--up)}
.rec i.short{background:rgba(255,82,82,.15);color:var(--down)}
.hor{text-align:end}
.hor i{font-style:normal;font-size:9.5px;font-weight:700;padding:2px 6px;border-radius:6px;white-space:nowrap}
.hor .scalp{background:rgba(255,209,102,.16);color:var(--gold)}
.hor .short{background:rgba(0,240,255,.1);color:var(--cyan)}
.hor .intra{background:rgba(0,240,255,.16);color:#7dfbff}
.hor .swing{background:rgba(183,148,244,.18);color:#c9a8ff}
/* expanded detail row */
.det{grid-column:1/-1;background:rgba(0,240,255,.05);border:1px solid rgba(0,240,255,.16);
  border-radius:10px;padding:10px 12px;font-size:12px;line-height:1.7;margin-top:6px}
.det .why{color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:10.5px}
.det .lv{display:flex;gap:14px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-size:11.5px;margin-top:4px}
.det .lv b{font-weight:600;color:var(--dim);font-size:10px;display:block}
.empty{padding:26px 10px;text-align:center;color:var(--dim);font-size:13px}
footer{max-width:900px;margin:0 auto;padding:8px 14px 22px;color:var(--dim);font-size:10.5px;line-height:1.6}
@media (max-width:620px){
  /* phone: hide RSI + volume-surge columns; they live in the expanded row */
  .mhead,.mrow{grid-template-columns:1.5fr .9fr .66fr .66fr .72fr .95fr}
  .c-rsi,.c-volx{display:none}
  .mhead{top:52px}
}

<body>
<header>
  <h1>📡 ראדאר <b>שווקים</b></h1>
  <span class="hcount" id="count">—</span>
  <span id="scanStat"></span>
  <span class="hspace"></span>
  <button class="hbtn" id="refreshBtn">↻ רענן</button>
  <a class="hbtn" href="./">⌂ אלפא</a>
</header>
<main>
  <input class="search" id="q" placeholder="חיפוש מטבע או שם…" autocomplete="off">
  <div class="tabs" id="tabs">
    <button data-f="all" class="on">הכול</button>
    <button data-f="rec">🔥 מומלצים כרגע</button>
    <button data-f="mov5">⚡ זזים ב-5 דק׳</button>
    <button data-f="fav">⭐ מועדפים</button>
    <button data-f="gainers">עולים</button>
    <button data-f="losers">יורדים</button>
  </div>
  <div class="mhead">
    <button data-s="name">שם / מחזור ⇅</button>
    <button data-s="price">מחיר ⇅</button>
    <button data-s="chg">24ש ⇅</button>
    <button data-s="m15">15ד ⇅</button>
    <button data-s="m5">5ד ⇅</button>
    <button data-s="rsi" class="c-rsi">RSI ⇅</button>
    <button data-s="volx" class="c-volx">מחזור× ⇅</button>
    <button data-s="rec" class="on">מומלץ + אופק ⇅</button>
  </div>
  <div id="list"><div class="empty">טוען את רשימת החוזים…</div></div>
</main>
<footer>
  ⚠️ הציון וההמלצות מחושבים אוטומטית מנרות אמת של Binance (‏EMA‏, RSI‏, MACD‏, מחזור) —
  אין בכך ייעוץ השקעות. "אופק" הוא הערכת טווח הרלוונטיות של האיתות לפי אילו אותות מניעים אותו,
  לא הבטחה. רמות הכניסה/סטופ בהרחבת שורה נגזרות מ-ATR של נרות דקה.
</footer>
<script>
'use strict';
// ════════════════════════════════════════════════════════════════════════
//  MARKET RADAR — the arena's futures browser as its own app.
//  Same engine, same honesty rule: every number on this page is computed
//  from exchange candles; nothing is invented. What this page adds over
//  the in-arena panel is ROOM — more columns (15m, RSI, volume surge), a
//  recommendation HORIZON, and a tap-to-expand row with the reasoning and
//  ATR-derived levels.
// ════════════════════════════════════════════════════════════════════════
const FAPI='https://fapi.binance.com';
const $=(id)=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fmtUsd(v){ if(v>=1e9) return '$'+(v/1e9).toFixed(2)+'B';
  if(v>=1e6) return '$'+(v/1e6).toFixed(1)+'M';
  if(v>=1e3) return '$'+(v/1e3).toFixed(1)+'K'; return '$'+(+v||0).toFixed(0); }
function emaArr(v,p){ const k=2/(p+1), o=new Array(v.length); let e=v[0];
  for(let i=0;i<v.length;i++){ e=i? v[i]*k+e*(1-k) : v[0]; o[i]=e; } return o; }
function rsiArr(c,p){ const o=new Array(c.length).fill(50); let g=0,l=0;
  for(let i=1;i<c.length;i++){ const d=c[i]-c[i-1];
    if(i<=p){ if(d>0)g+=d; else l-=d; if(i===p){ g/=p; l/=p; o[i]=100-100/(1+g/(l||1e-9)); } }
    else{ g=(g*(p-1)+Math.max(d,0))/p; l=(l*(p-1)+Math.max(-d,0))/p; o[i]=100-100/(1+g/(l||1e-9)); } }
  return o; }
function macdHistLast(c){ const e12=emaArr(c,12), e26=emaArr(c,26);
  const m=c.map((_,i)=>e12[i]-e26[i]); const s=emaArr(m,9); return m[m.length-1]-s[s.length-1]; }
function atrVal(cs,p){ let a=0,n=0;
  for(let i=Math.max(1,cs.length-p);i<cs.length;i++){
    const tr=Math.max(cs[i].h-cs[i].l,Math.abs(cs[i].h-cs[i-1].c),Math.abs(cs[i].l-cs[i-1].c));
    a+=tr; n++; } return n? a/n : 0; }

// ── universe ────────────────────────────────────────────────────────────
let universe=[], universeAt=0;
// the same favourites key the arena uses — a star here is a star there
let favs=new Set();
try{ favs=new Set(JSON.parse(localStorage.getItem('na:futfavs')||'[]')); }catch(e){}
const saveFavs=()=>{ try{ localStorage.setItem('na:futfavs',JSON.stringify([...favs])); }catch(e){} };
function decFromTick(t){ const s=String(t); if(s.indexOf('.')<0) return 0;
  const d=s.replace(/0+$/,'').split('.')[1]; return d? d.length : 0; }
async function loadUniverse(force){
  if(!force && universe.length && Date.now()-universeAt<120000) return universe;
  const [info,tick]=await Promise.all([
    fetch(`${FAPI}/fapi/v1/exchangeInfo`).then(r=>r.ok?r.json():null).catch(()=>null),
    fetch(`${FAPI}/fapi/v1/ticker/24hr`).then(r=>r.ok?r.json():null).catch(()=>null),
  ]);
  if(!info||!info.symbols) throw new Error('no exchangeInfo');
  const byPair={}; (Array.isArray(tick)?tick:[]).forEach(t=>{ byPair[t.symbol]=t; });
  const out=[];
  for(const s of info.symbols){
    if(s.contractType!=='PERPETUAL' || s.status!=='TRADING') continue;
    const t=byPair[s.symbol]||{};
    const pf=(s.filters||[]).find(f=>f.filterType==='PRICE_FILTER');
    out.push({ sym:s.baseAsset, pair:s.symbol, quote:s.quoteAsset,
      dec: pf? decFromTick(pf.tickSize) : (s.pricePrecision??2),
      price:+t.lastPrice||0, chg:+t.priceChangePercent||0, vol:+t.quoteVolume||0 });
  }
  universe=out; universeAt=Date.now();
  return out;
}

// ── the scan: 1-minute candles through the arena's indicators ───────────
const scan={};                     // sym -> reading
let scanState={running:false,done:0,total:0,at:0};
const SCAN_MAX=120, SCAN_CONC=6, SCAN_TTL=90000;
function scanScore(cs,vol24){
  const n=cs.length; if(n<25) return null;
  const closes=cs.map(c=>c.c), p=closes[n-1];
  if(!(p>0)) return null;
  const back=k=>closes[Math.max(0,n-1-k)];
  const pct=f=> f>0? (p-f)/f*100 : 0;
  const m5=pct(back(5)), m15=pct(back(15));
  let R=rsiArr(closes,14)[n-1];
  const win=closes.slice(-15);
  if(Math.max(...win)===Math.min(...win)) R=50;   // a dead tape is neutral, not a max sell
  const e9=emaArr(closes,9)[n-1], e21=emaArr(closes,21)[n-1];
  const H=macdHistLast(closes)||0;
  let recent=0; for(let i=n-5;i<n;i++) recent+=cs[i].v||0;
  let base=0; for(let i=0;i<n-5;i++) base+=cs[i].v||0;
  const avg5=(n-5)>0? base/(n-5)*5 : 0;
  const volX=avg5>0? recent/avg5 : 1;
  const gap=(e9-e21)/p*100;
  let s=0;
  s+=clamp(m15/1.5,-1.2,1.2)*22;
  s+=clamp(m5/0.8,-1.2,1.2)*20;
  s+=clamp(gap/0.18,-1,1)*16;
  s+=clamp((R-50)/25,-1,1)*10;
  s+=(H>0?1:H<0?-1:0)*6;
  let q=clamp(0.55+volX*0.42,0.5,1.35);
  if(R>80&&s>0) s*=0.45;
  if(R<20&&s<0) s*=0.45;
  if(vol24&&vol24<3e6) q*=0.45;
  const score=Math.round(clamp(Math.abs(s)*q,0,99));
  const atr=atrVal(cs,14);
  return { m5,m15,rsi:R,volX,gap,score,atr,price:p,
    dir:s>=0?'long':'short', macdUp:H>0,
    why:`RSI ${Math.round(R)} · מחזור ×${volX.toFixed(1)} · 15ד ${(m15>=0?'+':'')+m15.toFixed(2)}% · EMA ${e9>=e21?'שורי':'דובי'} · MACD ${H>0?'חיובי':'שלילי'}` };
}
/**
 * How long the signal is likely to stay relevant — derived from WHICH
 * signals drive it, never asserted:
 *   burst (fast 5m push on surging volume, no structure) → minutes
 *   EMA structure + 24h trend agreeing                   → days (swing)
 *   EMA structure                                        → hours (intraday)
 *   otherwise                                            → up to an hour
 */
function horizonOf(s,chg24){
  const dirSign = s.dir==='long'? 1 : -1;
  const structure = Math.abs(s.gap)>=0.12 && Math.sign(s.gap)===dirSign;
  const aligned24 = Math.sign(chg24)===dirSign && Math.abs(chg24)>=2;
  const burst = Math.abs(s.m5)>=0.45 && s.volX>=1.6;
  if(burst && !structure) return {k:'scalp', t:'⚡ דקות'};
  if(structure && aligned24) return {k:'swing', t:'📅 ימים'};
  if(structure) return {k:'intra', t:'🕐 שעות'};
  return {k:'short', t:'⏱ עד שעה'};
}
async function runScan(force,onProgress){
  if(scanState.running) return;
  if(!force && scanState.at && Date.now()-scanState.at<SCAN_TTL) return;
  await loadUniverse();
  const pool=universe.slice().sort((a,b)=>(b.vol||0)-(a.vol||0));
  const must=new Set(favs);
  const list=[], seen=new Set();
  for(const r of pool) if(must.has(r.sym)&&!seen.has(r.pair)){ list.push(r); seen.add(r.pair); }
  for(const r of pool){ if(list.length>=SCAN_MAX) break; if(seen.has(r.pair)) continue; list.push(r); seen.add(r.pair); }
  scanState={running:true,done:0,total:list.length,at:scanState.at};
  let i=0;
  const worker=async()=>{
    while(i<list.length){
      const r=list[i++];
      try{
        const res=await fetch(`${FAPI}/fapi/v1/klines?symbol=${r.pair}&interval=1m&limit=90`);
        if(res.ok){
          const raw=await res.json();
          const cs=(Array.isArray(raw)?raw:[]).map(a=>({o:+a[1],h:+a[2],l:+a[3],c:+a[4],v:+a[5]}));
          const sc=scanScore(cs,r.vol);
          if(sc) scan[r.sym]=Object.assign(sc,{at:Date.now()});
        }
      }catch(e){}
      scanState.done++;
      if(onProgress && scanState.done%8===0) onProgress();
    }
  };
  try{ await Promise.all(Array.from({length:Math.min(SCAN_CONC,list.length)},worker)); }
  finally{ scanState.running=false; scanState.at=Date.now(); }
  if(onProgress) onProgress();
}

// ── table state + render ────────────────────────────────────────────────
let filter='all', sortKey='rec', sortDir=-1, query='', expanded=null;
function rows(){
  let out=universe.slice();
  if(query){ const q=query.toUpperCase();
    out=out.filter(r=>r.sym.includes(q)||r.pair.includes(q)); }
  if(filter==='fav') out=out.filter(r=>favs.has(r.sym));
  else if(filter==='gainers') out=out.filter(r=>r.chg>0);
  else if(filter==='losers') out=out.filter(r=>r.chg<0);
  else if(filter==='rec') out=out.filter(r=>(scan[r.sym]?.score??0)>=45);
  else if(filter==='mov5') out=out.filter(r=>Math.abs(scan[r.sym]?.m5??0)>=0.35);
  const sKeys={m5:'m5',m15:'m15',rsi:'rsi',volx:'volX',rec:'score'};
  if(sKeys[sortKey]){
    const k=sKeys[sortKey];
    out.sort((a,b)=>{ const A=scan[a.sym], B=scan[b.sym];
      if(!A&&!B) return (b.vol||0)-(a.vol||0);
      if(!A) return 1; if(!B) return -1;
      return sortDir*(A[k]-B[k]); });
    return out;
  }
  const key={name:'sym',price:'price',chg:'chg'}[sortKey]||'sym';
  out.sort((a,b)=> key==='sym'
    ? -sortDir*String(a.sym).localeCompare(String(b.sym))
    :  sortDir*(((a[key])??0)-((b[key])??0)));
  return out;
}
function pctCell(v,cls){
  if(v==null) return `<span class="num ${cls||''}" style="color:var(--dim)">—</span>`;
  const col=v>=0.03?'var(--up)':v<=-0.03?'var(--down)':'var(--dim)';
  return `<span class="num ${cls||''}" style="color:${col}">${(v>=0?'+':'')+v.toFixed(2)}%</span>`;
}
function render(){
  const el=$('list');
  $('scanStat').textContent=scanState.running? `⟳ ${scanState.done}/${scanState.total}` : '';
  if(!universe.length) return;
  const rs=rows();
  $('count').textContent=rs.length+' חוזים';
  if(!rs.length){ el.innerHTML='<div class="empty">אין חוזה שתואם</div>'; return; }
  const top=el.scrollTop;
  el.innerHTML=rs.slice(0,200).map(r=>{
    const s=scan[r.sym];
    const hor=s? horizonOf(s,r.chg) : null;
    const recCell = s
      ? `<i class="${s.score<45?'':s.dir}" title="${s.why}">${s.dir==='long'?'▲':'▼'}${s.score}</i>`
      : (scanState.running?'<i>…</i>':'<i>—</i>');
    const open = expanded===r.sym;
    let det='';
    if(open && s){
      const dirW = s.dir==='long'? 'לונג ▲' : 'שורט ▼';
      const stop = s.dir==='long'? s.price-s.atr*3 : s.price+s.atr*3;
      const tgt  = s.dir==='long'? s.price+s.atr*4.5 : s.price-s.atr*4.5;
      const fx=(v)=>v.toLocaleString('en-US',{minimumFractionDigits:r.dec,maximumFractionDigits:r.dec});
      det=`<div class="det">
        <div><b>${r.sym}/USDT</b> · כיוון: ${dirW} · ציון ${s.score} · אופק ${hor.t}</div>
        <div class="why">${s.why}</div>
        <div class="lv">
          <span><b>מחיר עכשיו</b>${fx(s.price)}</span>
          <span><b>סטופ (ATR×3)</b>${fx(stop)}</span>
          <span><b>יעד (ATR×4.5)</b>${fx(tgt)}</span>
          <span><b>ATR דקה</b>${fx(s.atr)}</span>
        </div>
        <div class="why" style="margin-top:4px">האופק נגזר מהאותות שמניעים את הציון: פרץ 5-דק׳ בלי מבנה = דקות · מבנה EMA = שעות · מבנה + מגמת 24ש = ימים.</div>
      </div>`;
    }
    return `<div class="mrow" data-sym="${r.sym}">
      <span class="mname">
        <span class="star${favs.has(r.sym)?' on':''}" data-fav="${r.sym}">${favs.has(r.sym)?'★':'☆'}</span>
        <span class="nn">
          <span class="n1"><b>${r.sym}</b><span class="tag">Perp</span></span>
          <span class="sub">${fmtUsd(r.vol)}</span>
        </span>
      </span>
      <span class="num">${r.price? r.price.toLocaleString('en-US',{minimumFractionDigits:r.dec,maximumFractionDigits:r.dec}) : '—'}</span>
      ${pctCell(r.chg)}
      ${pctCell(s?s.m15:null)}
      ${pctCell(s?s.m5:null)}
      <span class="num c-rsi">${s? Math.round(s.rsi) : '—'}</span>
      <span class="num c-volx">${s? '×'+s.volX.toFixed(1) : '—'}</span>
      <span class="rec">${recCell} ${hor?`<span class="hor"><i class="${hor.k}">${hor.t}</i></span>`:''}</span>
      ${det}
    </div>`;
  }).join('') + (rs.length>200? `<div class="empty">מוצגים 200 מתוך ${rs.length} — צמצם עם חיפוש</div>`:'');
  el.scrollTop=top;
}

// ── wiring ──────────────────────────────────────────────────────────────
$('q').oninput=e=>{ query=e.target.value.trim(); render(); };
$('tabs').querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{ filter=b.dataset.f;
    $('tabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
    if(filter==='rec'){ sortKey='rec'; sortDir=-1; syncSort(); }
    if(filter==='mov5'){ sortKey='m5'; sortDir=-1; syncSort(); }
    render(); kick(); };
});
function syncSort(){ document.querySelectorAll('.mhead button').forEach(x=>x.classList.toggle('on',x.dataset.s===sortKey)); }
document.querySelectorAll('.mhead button').forEach(b=>{
  b.onclick=()=>{ if(sortKey===b.dataset.s) sortDir*=-1; else { sortKey=b.dataset.s; sortDir=-1; }
    syncSort(); render(); kick(); };
});
$('list').onclick=e=>{
  const fav=e.target.closest('[data-fav]');
  if(fav){ const s=fav.dataset.fav;
    if(favs.has(s)) favs.delete(s); else favs.add(s);
    saveFavs(); render(); return; }
  const row=e.target.closest('.mrow'); if(!row) return;
  expanded = expanded===row.dataset.sym ? null : row.dataset.sym;
  render();
};
$('refreshBtn').onclick=()=>{ boot(true); };
function kick(force){ runScan(force,render).then(render).catch(()=>render()); }
async function boot(force){
  try{
    await loadUniverse(force);
    render();
    kick(force);
  }catch(e){
    $('list').innerHTML='<div class="empty">רשימת החוזים לא נטענה — ‏Binance Futures לא נגיש מהרשת הזו</div>';
  }
}
boot(false);
// stay fresh, but never spin in a hidden tab
setInterval(()=>{ if(!document.hidden){ loadUniverse(false).then(render).catch(()=>{}); kick(false); } }, 45000);
// test hooks — the same style every app in the suite exposes
window.__mkt={ rows, scan:()=>scan, state:()=>({filter,sortKey,sortDir,query,expanded}),
  universe:()=>universe, scoreOf:scanScore, horizonOf, run:(f)=>runScan(f!==false,render),
  scanState:()=>scanState, setUniverse:(u)=>{universe=u;universeAt=Date.now();render();} };
</script>
</body>
