<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AI Core — Cyberpunk Sun</title>
<style>
  /* Full-bleed dark stage — the scene owns the whole viewport. */
  html, body { margin: 0; height: 100%; background: #05060a; overflow: hidden; }
  canvas { display: block; }
  /* Minimal HUD caption, purely cosmetic. */
  .hud {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    font: 500 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: 5px; color: rgba(230, 200, 130, .55);
    text-transform: uppercase; user-select: none; pointer-events: none;
  }
</style>
</head>
<body>
<div class="hud">Alpha&nbsp;Core&nbsp;·&nbsp;Online</div>

<!-- Three.js from CDN via import map (r160+ is ESM-only) -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.184.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.184.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ════════════════════════════════════════════════════════════════════
   RENDERER / SCENE / CAMERA
   ════════════════════════════════════════════════════════════════════ */
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
// Cap the pixel ratio: retina DPR 2-3 through a bloom pipeline is 4-9× the
// pixels for almost no visible gain — 1.5 keeps phones/iPads smooth.
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.95;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05060a);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 7.5);
camera.lookAt(0, 0, 0);

/* ════════════════════════════════════════════════════════════════════
   1 · THE CORE — morphing neon sun
   A sphere whose VERTICES are displaced by 3D simplex noise (so the
   silhouette itself boils, not just the texture), and whose FRAGMENT
   shader is a cheap white-hot → gold fresnel gradient. Keeping the
   per-pixel work noise-free is deliberate: big-value noise math in
   fp16 fragment shaders overflows to NaN on many mobile GPUs, while
   vertex shaders are guaranteed highp — so the noise lives there.
   ════════════════════════════════════════════════════════════════════ */
const CORE_RADIUS = 1.15;

// Ashima 3D simplex noise (public domain) — vertex-stage only, see above.
const SIMPLEX_GLSL = /* glsl */`
  vec3 mod289(vec3 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 mod289(vec4 x){return x-floor(x*(1.0/289.0))*289.0;}
  vec4 permute(vec4 x){return mod289(((x*34.0)+1.0)*x);}
  vec4 taylorInvSqrt(vec4 r){return 1.79284291400159-0.85373472095314*r;}
  float snoise(vec3 v){
    const vec2 C=vec2(1.0/6.0,1.0/3.0); const vec4 D=vec4(0.0,0.5,1.0,2.0);
    vec3 i=floor(v+dot(v,C.yyy)); vec3 x0=v-i+dot(i,C.xxx);
    vec3 g=step(x0.yzx,x0.xyz); vec3 l=1.0-g; vec3 i1=min(g.xyz,l.zxy); vec3 i2=max(g.xyz,l.zxy);
    vec3 x1=x0-i1+C.xxx; vec3 x2=x0-i2+C.yyy; vec3 x3=x0-D.yyy;
    i=mod289(i);
    vec4 p=permute(permute(permute(i.z+vec4(0.0,i1.z,i2.z,1.0))+i.y+vec4(0.0,i1.y,i2.y,1.0))+i.x+vec4(0.0,i1.x,i2.x,1.0));
    float n_=0.142857142857; vec3 ns=n_*D.wyz-D.xzx;
    vec4 j=p-49.0*floor(p*ns.z*ns.z);
    vec4 x_=floor(j*ns.z); vec4 y_=floor(j-7.0*x_);
    vec4 x=x_*ns.x+ns.yyyy; vec4 y=y_*ns.x+ns.yyyy; vec4 h=1.0-abs(x)-abs(y);
    vec4 b0=vec4(x.xy,y.xy); vec4 b1=vec4(x.zw,y.zw);
    vec4 s0=floor(b0)*2.0+1.0; vec4 s1=floor(b1)*2.0+1.0; vec4 sh=-step(h,vec4(0.0));
    vec4 a0=b0.xzyw+s0.xzyw*sh.xxyy; vec4 a1=b1.xzyw+s1.xzyw*sh.zzww;
    vec3 p0=vec3(a0.xy,h.x); vec3 p1=vec3(a0.zw,h.y); vec3 p2=vec3(a1.xy,h.z); vec3 p3=vec3(a1.zw,h.w);
    vec4 norm=taylorInvSqrt(vec4(dot(p0,p0),dot(p1,p1),dot(p2,p2),dot(p3,p3)));
    p0*=norm.x; p1*=norm.y; p2*=norm.z; p3*=norm.w;
    vec4 m=max(0.6-vec4(dot(x0,x0),dot(x1,x1),dot(x2,x2),dot(x3,x3)),0.0); m=m*m;
    return 42.0*dot(m*m,vec4(dot(p0,x0),dot(p1,x1),dot(p2,x2),dot(p3,x3)));
  }
`;

const coreUniforms = {
  uTime:  { value: 0 },
  uPulse: { value: 1 },   // 1 ± breathing, also feeds brightness
};

const coreMat = new THREE.ShaderMaterial({
  uniforms: coreUniforms,
  vertexShader: /* glsl */`
    uniform float uTime;
    uniform float uPulse;
    varying vec3 vNormalW;
    varying vec3 vViewDirW;
    varying float vDisp;
    ${SIMPLEX_GLSL}
    void main() {
      // Two octaves of slow simplex noise push each vertex along its
      // normal — the surface boils like a plasma ball instead of
      // reading as a rigid CG sphere.
      float n = snoise(normal * 2.2 + vec3(0.0, uTime * 0.25, 0.0)) * 0.6
              + snoise(normal * 5.5 + vec3(uTime * 0.45)) * 0.4;
      vDisp = n;
      vec3 displaced = position + normal * n * 0.085 * uPulse;
      vec4 worldPos = modelMatrix * vec4(displaced, 1.0);
      vNormalW  = normalize(mat3(modelMatrix) * normal);
      vViewDirW = normalize(cameraPosition - worldPos.xyz);
      gl_Position = projectionMatrix * viewMatrix * worldPos;
    }
  `,
  fragmentShader: /* glsl */`
    precision highp float;
    uniform float uTime;
    uniform float uPulse;
    varying vec3 vNormalW;
    varying vec3 vViewDirW;
    varying float vDisp;
    void main() {
      // Facing ratio: 1 at the center of the disc, 0 at the limb.
      float facing = clamp(dot(normalize(vNormalW), normalize(vViewDirW)), 0.0, 1.0);
      // White-hot heart -> saturated gold limb, like an over-exposed star.
      vec3 heart = vec3(1.0, 0.98, 0.90);
      vec3 gold  = vec3(1.0, 0.72, 0.25);
      vec3 rim   = vec3(1.0, 0.45, 0.10);
      vec3 col = mix(rim, gold, smoothstep(0.0, 0.4, facing));
      col = mix(col, heart, smoothstep(0.55, 0.95, facing));
      // The vertex-noise value doubles as surface "granulation" shading —
      // free detail with zero per-pixel noise math (mobile-safe).
      col *= 0.92 + vDisp * 0.22;
      // Values > 1.0 are what the bloom pass feeds on.
      col *= (1.05 + 0.3 * (uPulse - 1.0) * 10.0);
      gl_FragColor = vec4(col, 1.0);
    }
  `,
});
const core = new THREE.Mesh(new THREE.SphereGeometry(CORE_RADIUS, 96, 96), coreMat);
scene.add(core);

// Soft additive halo just behind the limb — sells the "atmosphere" even
// before bloom kicks in. A back-side shell with inverted fresnel.
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(CORE_RADIUS * 1.28, 48, 48),
  new THREE.ShaderMaterial({
    uniforms: coreUniforms,
    side: THREE.BackSide,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
    vertexShader: /* glsl */`
      varying vec3 vNormalW; varying vec3 vViewDirW;
      void main() {
        vec4 worldPos = modelMatrix * vec4(position, 1.0);
        vNormalW  = normalize(mat3(modelMatrix) * normal);
        vViewDirW = normalize(cameraPosition - worldPos.xyz);
        gl_Position = projectionMatrix * viewMatrix * worldPos;
      }
    `,
    fragmentShader: /* glsl */`
      precision highp float;
      uniform float uPulse;
      varying vec3 vNormalW; varying vec3 vViewDirW;
      void main() {
        float rim = 1.0 - clamp(dot(normalize(-vNormalW), normalize(vViewDirW)), 0.0, 1.0);
        float a = pow(rim, 3.4) * 0.32 * uPulse;
        gl_FragColor = vec4(vec3(1.0, 0.78, 0.35), a);
      }
    `,
  }),
);
scene.add(halo);

/* ════════════════════════════════════════════════════════════════════
   2 · THE LATTICE — twin wireframe cages + glowing vertex nodes
   Inner cage: pale gold. Outer cage: cyan. EdgesGeometry gives sharp
   single-pixel lines; a Points cloud drops a glowing digital node on
   every unique vertex of each shell.
   ════════════════════════════════════════════════════════════════════ */

// Round soft-dot sprite, baked once on a tiny canvas (no asset files).
function makeDotTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 64;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0.0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.35, 'rgba(255,255,255,.85)');
  grad.addColorStop(1.0, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 64, 64);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}
const dotTex = makeDotTexture();

// Build one cage: wireframe shell + node points at its unique vertices.
function buildCage(radius, detail, color, nodeSize) {
  const group = new THREE.Group();
  const geo = new THREE.IcosahedronGeometry(radius, detail);

  const wire = new THREE.LineSegments(
    new THREE.EdgesGeometry(geo),
    new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.38, blending: THREE.AdditiveBlending, depthWrite: false }),
  );
  group.add(wire);

  // Dedupe vertices (icosahedron buffers repeat corners per-face).
  const pos = geo.attributes.position;
  const seen = new Set();
  const verts = [];
  const v = new THREE.Vector3();
  for (let i = 0; i < pos.count; i++) {
    v.fromBufferAttribute(pos, i);
    const key = `${v.x.toFixed(3)},${v.y.toFixed(3)},${v.z.toFixed(3)}`;
    if (!seen.has(key)) { seen.add(key); verts.push(v.x, v.y, v.z); }
  }
  const nodesGeo = new THREE.BufferGeometry();
  nodesGeo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const nodes = new THREE.Points(nodesGeo, new THREE.PointsMaterial({
    color, size: nodeSize, map: dotTex, transparent: true, opacity: 0.95,
    blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
  }));
  group.add(nodes);
  return group;
}

const cageGold = buildCage(1.85, 1, 0xE8C97A, 0.16); // pale gold, inner
const cageCyan = buildCage(2.45, 1, 0x59E8FF, 0.14); // cyan, outer
scene.add(cageGold, cageCyan);

/* ════════════════════════════════════════════════════════════════════
   3 · PARTICLE FIELD — dust slowly orbiting the whole structure
   Positions are generated in a flattened shell around the core; the
   whole cloud simply rotates (zero per-particle CPU work per frame).
   ════════════════════════════════════════════════════════════════════ */
const DUST_COUNT = 900;
const dustPos = new Float32Array(DUST_COUNT * 3);
for (let i = 0; i < DUST_COUNT; i++) {
  const r = 3.2 + Math.random() * 6.5;                 // shell radius
  const theta = Math.random() * Math.PI * 2;           // around Y
  const y = (Math.random() - 0.5) * (2.6 + r * 0.35);  // squashed vertically
  dustPos[i * 3]     = Math.cos(theta) * r;
  dustPos[i * 3 + 1] = y;
  dustPos[i * 3 + 2] = Math.sin(theta) * r;
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({
  color: 0xBFD8E8, size: 0.05, map: dotTex, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true,
}));
scene.add(dust);

/* ════════════════════════════════════════════════════════════════════
   POST-PROCESSING — bloom is what turns "bright" into "radiant"
   ════════════════════════════════════════════════════════════════════ */
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(
  new THREE.Vector2(window.innerWidth, window.innerHeight),
  0.55,  // strength
  0.5,   // radius — soft falloff
  0.72,  // threshold — only the hot core + nodes bloom, not the dust
);
composer.addPass(bloom);
composer.addPass(new OutputPass());

/* ════════════════════════════════════════════════════════════════════
   4 · ANIMATION LOOP
   ════════════════════════════════════════════════════════════════════ */
const clock = new THREE.Clock();

function animate() {
  const t  = clock.getElapsedTime();
  const dt = Math.min(clock.getDelta() + 0.016, 0.05); // guard vs tab-switch jumps

  // Core: gentle two-frequency breathing (scale + shader brightness).
  const pulse = 1 + Math.sin(t * 1.4) * 0.03 + Math.sin(t * 0.53) * 0.015;
  coreUniforms.uTime.value  = t;
  coreUniforms.uPulse.value = pulse;
  core.scale.setScalar(pulse);
  bloom.strength = 0.55 + (pulse - 1) * 4.0;           // glow breathes with it
  core.rotation.y += dt * 0.05;                        // barely-there drift

  // Cages: slow counter-rotation on multiple axes → orbital, gyroscopic.
  cageGold.rotation.y += dt * 0.18;
  cageGold.rotation.x += dt * 0.07;
  cageCyan.rotation.y -= dt * 0.11;
  cageCyan.rotation.z += dt * 0.09;
  cageCyan.rotation.x -= dt * 0.04;

  // Dust: one lazy orbit around the whole structure.
  dust.rotation.y += dt * 0.02;
  dust.rotation.z += dt * 0.004;

  composer.render();
}
renderer.setAnimationLoop(animate);

/* ════════════════════════════════════════════════════════════════════
   RESPONSIVE RESIZE
   ════════════════════════════════════════════════════════════════════ */
window.addEventListener('resize', () => {
  const w = window.innerWidth, h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
  bloom.resolution.set(w, h);
});
</script>
</body>
</html>
