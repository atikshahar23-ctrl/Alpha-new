name: scalp-shift
# The server-side shift of the 3-candle paper desk — trades while no
# phone is open. Paper only; no exchange keys exist anywhere in this job.
on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub batches these — real cadence is ~5-15 min
  workflow_dispatch:
    inputs:
      command:
        description: 'run / on / off / reset'
        required: false
        default: 'run'

permissions:
  contents: write

concurrency:
  group: scalp-shift
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: trading cycle
        run: node server/scalp-shift.mjs "${{ github.event.inputs.command || 'run' }}"
