name: scalp-shift
# The server-side shift of the 3-candle paper desk — trades while no
# phone is open. Paper only; no exchange keys exist anywhere in this job.
# NOTE: no marketplace actions here (repo policy blocks them — same
# reason deploy.yml clones manually); the runner's system Node is used.
on:
  schedule:
    - cron: '*/5 * * * *'   # GitHub batches these — real cadence is ~5-15 min
  workflow_dispatch:
    inputs:
      command:
        description: 'run / on / off / reset / cfg stop=1 ct=3 floor=0.5 score=4 size=100 lev=5'
        required: false
        default: 'run'

permissions:
  contents: write

concurrency:
  group: scalp-shift
  cancel-in-progress: false

jobs:
  shift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        run: |
          git clone --depth 1 --branch main \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" .

      - name: Trading cycle
        env:
          # optional Binance Futures TESTNET keys (demo money only) — add
          # them under Settings → Secrets → Actions to mirror paper trades
          # as real testnet orders; absent secrets = paper-only, unchanged
          BINANCE_TESTNET_KEY: ${{ secrets.BINANCE_TESTNET_KEY }}
          BINANCE_TESTNET_SECRET: ${{ secrets.BINANCE_TESTNET_SECRET }}
        run: |
          node --version
          node server/scalp-shift.mjs "${{ github.event.inputs.command || 'run' }}"
