<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Alpha Assistant</title>
  <script>
    // Force-clear old service workers and caches on every load
    (function(){
      if('serviceWorker' in navigator){
        navigator.serviceWorker.getRegistrations().then(function(regs){
          regs.forEach(function(r){ r.unregister(); });
        });
      }
      if('caches' in window){
        caches.keys().then(function(keys){
          keys.forEach(function(k){ caches.delete(k); });
        });
      }
    })();
  </script>
  <link rel="manifest" href="%BASE_URL%manifest.json" />
  <link rel="icon" type="image/png" href="%BASE_URL%favicon-bull.png" />
  <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
  <meta name="theme-color" content="#daa520" />
  <!-- iOS ignores most of manifest.json — without these, "Add to Home
       Screen" saves a plain Safari bookmark instead of a standalone app. -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Alpha" />
  <meta name="mobile-web-app-capable" content="yes" />
  <!-- Warm the default orb character + pokeball so they appear instantly. -->
  <link rel="preload" as="fetch" type="model/gltf-binary" href="%BASE_URL%ar-models/pikachu.glb" crossorigin="anonymous" />
  <link rel="preload" as="fetch" type="model/gltf-binary" href="%BASE_URL%ar-models/pokeball.glb" crossorigin="anonymous" />
  <!-- Puter removed — cloud sync is Google Drive only (the owner's Google
       account), and the AI provider is Groq/Gemini/Claude via API key. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Assistant:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  />
</head>
<body>
  <!-- ── Intro: the owner's own Suno anthem (golden-gate lyric video) plays
            fullscreen with its music as the app's opening — then the panels
            appear. Replaces the old alien/biometric/vault sequence. ── -->
  <div id="introOverlay">
    <video id="introVid" playsinline preload="auto" src="%BASE_URL%boot-intro.mp4"></video>
    <div class="intro-brand" aria-hidden="true">A L P H A</div>
    <div class="intro-progress" aria-hidden="true"><span id="introBar"></span></div>
    <button id="introSound" type="button" hidden>🔊 הקש לסאונד</button>
    <button id="introSkip" type="button">דלג ⏭</button>
  </div>
  <style>
    /* keep EVERYTHING out until the intro completes — nothing shows before reveal */
    html.booting #app{ opacity:0 !important; }
    html.booting .welcome-overlay{ opacity:0 !important; pointer-events:none !important; }
    body.revealed .app{ animation: app-in .9s ease both; }
    @keyframes app-in{ from{opacity:0} to{opacity:1} }   /* opacity only — no layout shift */
    #introOverlay{position:fixed;inset:0;z-index:99999;background:#000;overflow:hidden;transition:opacity .6s ease,transform .7s ease}
    /* Fast-boot veil — repeat-session loads (cinematic intro already seen).
       Short, digital, on-brand: the HeavyGuard logo with a scanning sweep. */
    #fastBootVeil{position:fixed;inset:0;z-index:99999;background:#07050a;display:flex;flex-direction:column;
      align-items:center;justify-content:center;gap:22px;transition:opacity .5s ease}
    #fastBootVeil.gone{opacity:0;pointer-events:none}
    .fb-logo-wrap{position:relative;width:112px;height:112px;overflow:hidden;border-radius:16px;
      filter:drop-shadow(0 0 26px rgba(228,188,99,.35))}
    .fb-logo{width:100%;height:100%;object-fit:contain;animation:fbPulse 2.2s ease-in-out infinite}
    .fb-scan{position:absolute;left:-6%;right:-6%;height:3px;top:0;
      background:linear-gradient(90deg,transparent,rgba(120,220,255,.9),transparent);
      box-shadow:0 0 10px rgba(120,220,255,.7);animation:fbScan 1.8s linear infinite}
    @keyframes fbPulse{0%,100%{opacity:.88;transform:scale(1)}50%{opacity:1;transform:scale(1.035)}}
    @keyframes fbScan{0%{top:0}100%{top:100%}}
    .fb-bar{width:180px;height:4px;border-radius:3px;background:rgba(228,188,99,.14);overflow:hidden}
    .fb-bar span{display:block;height:100%;width:35%;background:linear-gradient(90deg,transparent,#E4BC63,transparent);
      animation:fbLoad 1.1s ease-in-out infinite}
    @keyframes fbLoad{0%{transform:translateX(-120%)}100%{transform:translateX(320%)}}
    .fb-txt{font-family:'Space Grotesk',sans-serif;font-size:11.5px;letter-spacing:3px;color:#c9b27a;
      text-transform:uppercase;opacity:.85;max-width:90vw;text-align:center}
    /* The boot cinematic (starfield → the golden Alpha core igniting → a
       dashboard match-cut) is 16:9 with its subject dead-center, so cover
       works on every screen — portrait phones crop the sides, the core
       stays centered. The dark navy backdrop matches its starfield. */
    #introOverlay{background:#04070f}
    #introVid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .5s ease}
    .intro-brand{position:absolute;top:max(26px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:3;
      color:rgba(255,248,230,.92);font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;letter-spacing:9px;
      text-shadow:0 1px 12px rgba(120,60,0,.55)}
    .intro-progress{position:absolute;left:0;right:0;bottom:0;height:3px;z-index:3;background:rgba(120,60,0,.25)}
    .intro-progress span{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff2cf,#ffd97a);
      box-shadow:0 0 10px rgba(255,220,140,.8);transition:width .25s linear}
    #introSound{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));left:22px;z-index:5;
      background:rgba(60,30,4,.55);border:1px solid rgba(255,236,190,.55);color:#fff4d8;
      padding:8px 16px;border-radius:999px;font-family:Assistant,system-ui,sans-serif;font-size:14px;cursor:pointer;
      animation:sndPulse 1.6s ease-in-out infinite}
    @keyframes sndPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,220,140,.5)}50%{box-shadow:0 0 0 9px rgba(255,220,140,0)}}
    #introOverlay.gone{opacity:0;pointer-events:none}
    #introSkip{position:absolute;bottom:max(22px,env(safe-area-inset-bottom));right:22px;z-index:5;
      background:rgba(60,30,4,.55);border:1px solid rgba(255,236,190,.45);color:#fff4d8;
      padding:8px 16px;border-radius:999px;font-family:Assistant,system-ui,sans-serif;font-size:14px;cursor:pointer}
  </style>
  <script>
    (function(){
      var ov=document.getElementById('introOverlay'); if(!ov) return;
      // ── Anti-double-intro guard ────────────────────────────────────────────
      // The intro was occasionally playing twice (a spurious re-load/re-render
      // replays the whole sequence). Two guards: (1) a window flag stops the
      // IIFE running twice in one document; (2) a short session timestamp skips
      // the intro on any reload that lands within 8s of the last one — that's a
      // double-load, never an intentional revisit. A deliberate reload later
      // still shows the intro.
      if(window.__alphaIntro){ return; } window.__alphaIntro=true;
      // ── Per-session boot gate ──────────────────────────────────────────────
      // The boot animation + startup chime play ONLY on the first open of the
      // app session. Opening a sub-app (Heavy Guard / agents) and coming back
      // reloads index.html, which used to replay the whole veil + sound every
      // single time. sessionStorage persists across those same-tab navigations
      // but is cleared when the app is fully closed — so a return within the
      // same session reveals instantly and silently (no chime, no re-init
      // theatre), exactly "boot once until you fully close the main app".
      var __sessBooted=false;
      try{ __sessBooted=sessionStorage.getItem('alpha_session_booted')==='1'; }catch(e){}
      try{ sessionStorage.setItem('alpha_session_booted','1'); }catch(e){}
      if(__sessBooted){ ov.parentNode&&ov.parentNode.removeChild(ov); showFastBoot(); return; }
      // (No once-a-day gate anymore: the anthem video IS the loading screen
      // on every fresh open — it dismisses itself the moment the app is
      // actually ready (with a short minimum so the hook gets heard), so it
      // never costs more load time than the old branded veil did. The old
      // alpha_intro_day flag is intentionally ignored.)
      function showFastBoot(){
        document.documentElement.classList.add('booting');
        var veil=document.createElement('div');
        veil.id='fastBootVeil';
        veil.innerHTML='<div class="fb-logo-wrap"><img src="%BASE_URL%heavyguard-logo.png" class="fb-logo" alt="" /><div class="fb-scan"></div></div>'+
          '<div class="fb-bar"><span></span></div><div class="fb-txt">מאתחל מערכת…</div>';
        document.body.appendChild(veil);
        var fbTxt=veil.querySelector('.fb-txt');
        // app.ts announces each system as it actually starts loading (real
        // progress, not a fake cycling animation) — this is the fix for
        // "I don't want to see panels loading in front of my face": the veil
        // now names exactly what's being prepared instead of a static caption
        // that could sit there while data is still quietly loading behind it.
        function onBootStep(e){ if(fbTxt) fbTxt.textContent='טוען ' + e.detail + '…'; }
        window.addEventListener('alpha-boot-step', onBootStep);
        var fbDone=false;
        var fbStart=performance.now();
        function fbReveal(){
          if(fbDone) return; fbDone=true;
          window.removeEventListener('alpha-boot-step', onBootStep);
          revealApp();
          veil.classList.add('gone');
          setTimeout(function(){ veil.parentNode&&veil.parentNode.removeChild(veil); }, 500);
        }
        // Real readiness (window.__alphaReady, set by main.ts once the HUD's
        // live data — not just the render calls that kick off fetching it —
        // has actually settled) gates the reveal, with a small minimum
        // display time so the veil never just flashes. Per explicit owner
        // request this genuinely waits for real data, no matter how long —
        // the 32s fallback below is only a last-resort safety net (matches
        // app.ts's own 30s data-wait ceiling plus margin) for a completely
        // hung connection, not a normal-path shortcut.
        (function poll(){
          if(fbDone) return;
          var elapsed=performance.now()-fbStart;
          if(window.__alphaReady && elapsed>=450){ fbReveal(); return; }
          setTimeout(poll, 80);
        })();
        setTimeout(fbReveal, 32000);
      }
      document.documentElement.classList.add('booting');   // hide app + welcome until reveal
      var vid=document.getElementById('introVid'); var ended=false;
      function revealApp(){
        document.documentElement.classList.remove('booting');
        document.body.classList.add('revealed');   // panels animate in — only now
      }
      function finish(){
        if(ended) return; ended=true;
        ov.classList.add('gone'); // fades out + pointer-events:none via CSS
        var reaped=false;
        var reap=function(){
          if(reaped) return; reaped=true;
          try{ if(vid) vid.pause(); }catch(e){}
          ov.parentNode && ov.parentNode.removeChild(ov);
        };
        if(vid && !vid.paused && !vid.muted && !vid.__skipped){
          // The MUSIC rides over the reveal — it's the opening theme. The
          // faded-out overlay (with the still-playing video inside) stays in
          // the DOM until the song's own fade-out ends, then gets reaped.
          vid.addEventListener('ended', reap, {once:true});
          setTimeout(reap, 31000); // safety cap (clip is 28s)
        } else {
          setTimeout(reap, 800);
        }
        showFastBoot();
      }
      // Fade+stop — the user asked OUT of the intro, sound included.
      function silence(){
        if(vid) vid.__skipped=true;
        try{
          var f=setInterval(function(){
            if(!vid || vid.muted || vid.volume<=0.06){ clearInterval(f); if(vid) vid.pause(); return; }
            vid.volume=Math.max(0,vid.volume-0.12);
          },60);
        }catch(e){}
      }
      function skip(){ silence(); finish(); }
      document.getElementById('introSkip').addEventListener('click', skip);
      // ── The owner's Suno anthem IS the loading screen ────────────────────
      // Play WITH sound when the browser allows it; when autoplay-with-audio
      // is blocked, keep rolling muted and surface a pulsing 🔊 button — the
      // first tap anywhere unmutes without restarting.
      var sndBtn=document.getElementById('introSound');
      function unmute(){
        if(!vid) return;
        vid.muted=false; vid.volume=1;
        if(sndBtn) sndBtn.hidden=true;
      }
      if(sndBtn) sndBtn.addEventListener('click', function(e){ e.stopPropagation(); unmute(); });
      window.addEventListener('pointerdown', function(){ if(vid && vid.muted && !ended) unmute(); }, {once:true});
      // bottom progress line — real playback progress, not a fake animation
      var bar=document.getElementById('introBar');
      if(vid && bar){
        vid.addEventListener('timeupdate', function(){
          if(vid.duration) bar.style.width=Math.min(100,(vid.currentTime/vid.duration)*100)+'%';
        });
      }
      if(vid){
        vid.loop=false;
        vid.addEventListener('ended', finish, {once:true});
        vid.addEventListener('error', finish, {once:true});
        vid.muted=false; vid.volume=1;
        var pr=vid.play && vid.play();
        if(pr && pr.catch) pr.catch(function(){
          // autoplay with sound blocked → roll muted + offer one-tap sound
          vid.muted=true;
          if(sndBtn) sndBtn.hidden=false;
          var p2=vid.play && vid.play();
          if(p2 && p2.catch) p2.catch(function(){ finish(); }); // video itself blocked → straight to the veil
        });
        // The cinematic is 10s and ENDS on a frame that looks like the
        // dashboard itself — so the reveal is a match-cut: play it through
        // ('ended' → finish above), and if the app still isn't ready at
        // that moment the branded veil bridges the difference.
        setTimeout(finish, 13000);   // hard fallback: clip is 10s — never get stuck
      } else { finish(); }
    })();
  </script>
  <div id="app"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
